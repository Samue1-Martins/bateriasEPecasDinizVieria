<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)" />
  <g filter="url(#shadow)" transform="translate(130, 75)">
    <rect width="340" height="260" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="170" cy="100" r="48" fill="#475569" fill-opacity="0.1" />
    <text x="170" y="112" font-size="44" text-anchor="middle" font-family="system-ui, sans-serif">✨</text>
    <text x="170" y="180" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle" font-family="system-ui, sans-serif">Vela de Ignição</text>
    <text x="170" y="210" font-size="14" fill="#64748B" text-anchor="middle" font-family="system-ui, sans-serif">Eletrodo Especial</text>
  </g>
  <rect x="20" y="20" width="140" height="28" rx="6" fill="#F1F5F9" />
  <text x="90" y="38" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" font-family="system-ui, sans-serif">FOTO ILUSTRATIVA</text>
</svg>
